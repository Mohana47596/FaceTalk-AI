<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e0b36" />
      <stop offset="40%" stop-color="#0b0314" />
      <stop offset="100%" stop-color="#030008" />
    </radialGradient>
    <radialGradient id="nebula" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-purple" cx="20%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#f857a6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ff5858" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#space-bg)" />
  <!-- Nebulae -->
  <circle cx="1344" cy="324" r="540" fill="url(#nebula)" />
  <circle cx="384" cy="756" r="648" fill="url(#nebula-purple)" />
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="200" r="1.5" />
    <circle cx="350" cy="120" r="1.0" />
    <circle cx="720" cy="280" r="2.0" />
    <circle cx="850" cy="180" r="1.5" />
    <circle cx="1100" cy="90" r="1.0" />
    <circle cx="1400" cy="250" r="2.5" />
    <circle cx="1650" cy="150" r="1.5" />
    <circle cx="1800" cy="300" r="2.0" />
    <circle cx="280" cy="450" r="1.0" />
    <circle cx="500" cy="550" r="1.5" />
    <circle cx="950" cy="400" r="2.0" />
    <circle cx="1250" cy="480" r="1.0" />
    <circle cx="1550" cy="520" r="1.5" />
    <circle cx="1720" cy="420" r="2.0" />
  </g>
  <!-- Glowing large stars -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.8">
    <path d="M720,270 L720,290 M710,280 L730,280" />
    <path d="M1400,238 L1400,262 M1388,250 L1412,250" />
