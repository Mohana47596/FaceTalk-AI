<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fe5f75" />
      <stop offset="50%" stop-color="#fc9842" />
      <stop offset="100%" stop-color="#ffe596" />
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d82b7" />
      <stop offset="50%" stop-color="#0b5b8c" />
      <stop offset="100%" stop-color="#023047" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9c46a" />
      <stop offset="100%" stop-color="#cca43b" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffb703" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Sunset Sky -->
  <rect width="1920" height="600" fill="url(#sunset)" />
  <!-- Glowing Sun -->
  <circle cx="960" cy="500" r="180" fill="url(#sun-glow)" />
  <!-- Sea -->
  <path d="M0,600 Q480,580 960,600 T1920,600 L1920,800 L0,800 Z" fill="url(#sea)" />
  <!-- Ocean Foam/Shoreline -->
  <path d="M0,740 Q480,720 960,750 T1920,730 L1920,1080 L0,1080 Z" fill="#8ecae6" opacity="0.4" />
  <path d="M0,755 Q480,735 960,765 T1920,745 L1920,1080 L0,1080 Z" fill="#ffffff" opacity="0.6" />
  <!-- Sandy Beach -->
  <path d="M0,770 Q480,750 960,780 T1920,760 L1920,1080 L0,1080 Z" fill="url(#sand)" />
</svg>
